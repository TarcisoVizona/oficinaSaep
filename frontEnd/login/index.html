<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Login</title>
  </head>
  <body>
    <div class="container">
      <div id="loginForm">
        <div>
          <h1>Seja Bem-vindo!</h1>
        </div>
        <div id="formInputs">
          <div>
            <h3>Email:</h3>
            <input type="text" placeholder="Digite seu email..." id="inputEmail"/>
          </div>
          <div>
            <h3>Senha:</h3>
            <input type="text" placeholder="Digite sua senha..." id="inputSenha"/>
          </div>
        </div>
        <div>
          <button id="btnEntrar">Entrar</button>
        </div>
      </div>
    </div>
  </body>
  <script src="script.js"></script>
</html>
